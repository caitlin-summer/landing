<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caitlin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖍️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f9fd;
    --panel: #ffffff;
    --ink: #2b2d42;
    --muted: #6a6e85;
    --line: #e3e8f2;
    --hover: #f0f4fb;
    --red: #ff8a8a;
    --yellow: #ffd95e;
    --green: #7fd68b;
    --blue: #6aaaff;
    --purple: #c4a1ff;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Lexend", system-ui, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; color: inherit; }

  .layout { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 18px;
    padding: 24px 16px;
    background: var(--panel);
    border-right: 1.5px solid var(--line);
  }
  .brand {
    font-family: "Baloo 2", "Lexend", sans-serif; font-weight: 800;
    font-size: 1.75rem; line-height: 1; letter-spacing: .5px;
    padding: 0 8px;
  }
  .brand span { display: inline-block; }
  .brand .wiggle { animation: wiggle 1.2s ease-in-out 1; }
  @keyframes wiggle {
    0%,100% { transform: rotate(0); }
    25% { transform: rotate(-8deg) translateY(-5px); }
    60% { transform: rotate(6deg) translateY(-2px); }
  }

  .search { position: relative; }
  .search .glass {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    font-size: .85rem; pointer-events: none; opacity: .75;
  }
  .search input {
    width: 100%;
    font: 400 .88rem "Lexend", sans-serif;
    color: var(--ink);
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 9px 38px 9px 34px;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .search input::placeholder { color: var(--muted); opacity: .7; }
  .search input:focus { outline: none; background: #fff; border-color: var(--ink); box-shadow: 2px 2px 0 var(--blue); }
  .search input::-webkit-search-cancel-button { display: none; }
  .kbd {
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    font-size: .7rem; color: var(--muted);
    border: 1.5px solid var(--line); border-radius: 6px; padding: 0 6px; background: #fff;
    pointer-events: none;
  }
  .kbd.hide { display: none; }
  .clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; display: none; place-items: center;
    font-size: .68rem; background: var(--hover);
    border: 0; border-radius: 50%; cursor: pointer; padding: 0; line-height: 1;
  }
  .clear.show { display: grid; }
  .clear:hover { background: var(--yellow); }

  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav-group { display: flex; flex-direction: column; gap: 2px; margin-top: 12px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left;
    background: transparent; border: 0; border-radius: 10px;
    padding: 7px 10px;
    font-size: .88rem; cursor: pointer;
    transition: background .12s;
  }
  .nav-item:hover { background: var(--hover); }
  .nav-item[aria-current="true"] { background: #fff1bf; font-weight: 500; }
  .nav-item .ni { display: grid; place-items: center; width: 22px; height: 22px; flex: none; }
  .nav-item .ni svg { width: 18px; height: 18px; }
  .nav-item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item .n { font-size: .74rem; color: var(--muted); }
  .nav-item.group { font-weight: 500; }
  .nav-item.sub { padding-left: 14px; font-size: .84rem; color: #444a63; }
  .nav-item.sub .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--blue)); border: 1.5px solid var(--ink); margin: 0 7px 0 3px; flex: none; }
  .nav-item:focus-visible, .card:focus-visible, .clear:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  /* ---------- Main ---------- */
  .main { padding: 40px 40px 64px; max-width: 1000px; width: 100%; margin: 0 auto; }
  .page-head { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; margin: 0 0 28px; }
  .page-head h1 { font-family: "Baloo 2", "Lexend", sans-serif; font-weight: 800; font-size: 1.7rem; line-height: 1.2; margin: 0; }
  .count { margin: 0; color: var(--muted); font-size: .82rem; white-space: nowrap; }

  .section { margin: 0 0 32px; }
  .group-title {
    display: flex; align-items: center; gap: 10px;
    font-family: "Baloo 2", "Lexend", sans-serif; font-weight: 800;
    font-size: 1.15rem; line-height: 1.2; margin: 0 0 14px;
  }
  .group-title::after { content: ""; flex: 1; height: 0; border-top: 2px dotted rgba(43, 45, 66, .22); }
  .gicon { display: grid; place-items: center; width: 30px; height: 30px; background: var(--g, var(--blue)); background: color-mix(in srgb, var(--g, var(--blue)) 55%, white); border-radius: 9px; }
  .gicon svg { width: 17px; height: 17px; }
  .sub-section { margin: 0 0 20px; }
  .sub-title { font: 500 .8rem "Lexend", sans-serif; color: var(--muted); margin: 0 0 10px; }
  .sub-title .n { margin-left: 4px; opacity: .8; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .card {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel);
    color: inherit; text-decoration: none;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px 12px 12px;
    box-shadow: 0 1px 2px rgba(43, 45, 66, .04);
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .card:hover { border-color: var(--ink); transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--accent, var(--blue)); }
  .icon {
    flex: none; width: 42px; height: 42px; display: grid; place-items: center;
    color: var(--ink);
    background: var(--accent, var(--blue));
    background: color-mix(in srgb, var(--accent, var(--blue)) 50%, white);
    border-radius: 12px;
  }
  .icon svg { width: 22px; height: 22px; }
  .text { min-width: 0; flex: 1; }
  .card h3 {
    font-family: "Baloo 2", "Lexend", sans-serif; font-size: 1rem; line-height: 1.2; font-weight: 800;
    margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card p { margin: 1px 0 0; color: var(--muted); font-size: .76rem; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .go { flex: none; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 1rem; opacity: .3; transition: opacity .15s, transform .15s; }
  .card:hover .go { opacity: .9; transform: translate(1px, -1px); }
  mark { background: var(--yellow); color: inherit; border-radius: 4px; padding: 0 2px; }
  .empty { display: none; text-align: center; color: var(--muted); margin-top: 40px; }

  /* ---------- Mobile: sidebar thành thanh trên cùng ---------- */
  @media (max-width: 860px) {
    .layout { display: block; }
    .sidebar {
      position: sticky; top: 0; z-index: 10; height: auto; overflow: visible;
      flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px 12px;
      padding: 10px 14px;
      border-right: 0; border-bottom: 1.5px solid var(--line);
    }
    .brand { font-size: 1.4rem; padding: 0; }
    .search { flex: 1 1 160px; }
    .nav { flex: 1 0 100%; flex-direction: row; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .nav::-webkit-scrollbar { display: none; }
    .nav-group { display: contents; }
    .nav-item, .nav-item.sub, .nav-item.group {
      width: auto; flex: none; white-space: nowrap; margin: 0;
      padding: 4px 12px; font-size: .82rem; font-weight: 400;
      background: var(--panel); border: 1.5px solid var(--line); border-radius: 999px;
    }
    .nav-item[aria-current="true"] { background: #fff1bf; border-color: var(--ink); }
    .nav-item .ni, .nav-item .dot { display: none; }
    .nav-item .n { margin-left: 2px; }
    .main { padding: 20px 16px 48px; }
    .page-head h1 { font-size: 1.4rem; }
    .grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

const BRAND = "Caitlin";
const COLORS = ["--red", "--yellow", "--green", "--blue", "--purple"];

/* Tên nhiều màu như bút sáp */

function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

/* Bỏ dấu tiếng Việt + chữ thường, để gõ "to mau" vẫn tìm ra "tô màu" */
function fold(s) {
  return String(s || "")
    .toLowerCase()
    .replace(/đ/g, "d")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

/* Tô sáng chữ khớp (so khớp không dấu, nhưng hiển thị chữ gốc) */
function highlight(text, terms) {
  if (!terms.length) return esc(text);
  const src = String(text);
  const chars = [...src];
  const folded = chars.map(c => fold(c) || c).join("");
  if (folded.length !== src.length) return esc(src);
  const mask = new Array(src.length).fill(false);
  terms.forEach(t => {
    let i = folded.indexOf(t);
    while (i !== -1) {
      for (let k = i; k < i + t.length; k++) mask[k] = true;
      i = folded.indexOf(t, i + t.length);
    }
  });
  let out = "", open = false;
  for (let i = 0; i < src.length; i++) {
    if (mask[i] && !open) { out += "<mark>"; open = true; }
    if (!mask[i] && open) { out += "</mark>"; open = false; }
    out += esc(src[i]);
  }
  return open ? out + "</mark>" : out;
}

function cardHTML(a, terms) {
  return `
    <a class="card" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" title="${esc(a.desc || "")}" style="--accent: var(--${esc(a.color || "blue")})">
      <div class="icon" aria-hidden="true">${icon(a.icon)}</div>
      <div class="text">
        <h3>${highlight(a.title, terms)}</h3>
        <p>${highlight(a.desc || "", terms)}</p>
      </div>
      <span class="go" aria-hidden="true">↗</span>
    </a>`;
}

function renderNav() {
  const searching = query.trim().length > 0;
  nav.innerHTML = GROUPS.map(g => {
    const n = APPS.filter(a => g.types.includes(a.type)).length;
    const on = !searching && curGroup === g.name ? ' aria-current="true"' : "";
    return `<button class="nav-item group" data-g="${esc(g.name)}"${on}>
      <span class="ni" aria-hidden="true">${icon(g.icon)}</span><span class="lbl">${esc(g.name)}</span><span class="n">${n}</span>
    </button>`;
  }).join("");
}

function render() {
  const terms = fold(query).split(/\s+/).filter(Boolean);
  const searching = terms.length > 0;
  const match = a => {
    const hay = fold([a.title, a.desc, a.type, a.keywords].join(" "));
    return terms.every(t => hay.includes(t));
  };
  let total = 0;

  /* Mặc định chỉ hiện mục đang chọn; khi tìm kiếm thì tìm trên tất cả */
  grid.innerHTML = GROUPS
    .filter(g => searching || g.name === curGroup)
    .map(g => {
      const lists = g.types
        .map(t => ({ t, items: APPS.filter(a => a.type === t && match(a)) }))
        .filter(x => x.items.length);
      if (!lists.length) return "";
      const showSub = lists.length > 1;
      const blocks = lists.map(({ t, items }) => {
        total += items.length;
        return `
        <div class="sub-section">
          ${showSub ? `<h3 class="sub-title">${esc(t)}<span class="n">${items.length}</span></h3>` : ""}
          <div class="grid">${items.map(a => cardHTML(a, terms)).join("")}</div>
        </div>`;
      }).join("");
      return `<section class="section" style="--g: var(--${esc(g.color)})">
        ${searching ? `<h2 class="group-title"><span class="gicon" aria-hidden="true">${icon(g.icon)}</span>${esc(g.name)}</h2>` : ""}
        ${blocks}
      </section>`;
    }).join("");

  pageTitle.textContent = searching ? `Kết quả cho “${query.trim()}”` : curGroup;
  empty.textContent = searching
    ? `Không tìm thấy “${query.trim()}” 🔎 Thử từ khác nhé!`
    : "Chưa có app nào ở mục này 🌱";
  empty.style.display = total ? "none" : "block";
  count.textContent = total ? `${total} app` : "";
  clearBtn.classList.toggle("show", query.length > 0);
  kbd.classList.toggle("hide", query.length > 0);
  renderNav();
}

nav.addEventListener("click", e => {
  const b = e.target.closest(".nav-item");
  if (!b) return;
  curGroup = b.dataset.g;
  input.value = ""; query = "";
  render();
  window.scrollTo({ top: 0 });
});

input.addEventListener("input", () => { query = input.value; render(); });
clearBtn.addEventListener("click", () => { input.value = ""; query = ""; render(); input.focus(); });
input.addEventListener("keydown", e => {
  if (e.key === "Escape" && query) { input.value = ""; query = ""; render(); }
});
/* Nhấn "/" để nhảy vào ô tìm kiếm */
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== input && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    input.focus();
  }
});

render();
</script>
</body>
</html>
