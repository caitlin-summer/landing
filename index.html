<!-- CỔNG MẬT KHẨU: mã hiện tại 565656. Đổi mã: thay HASH (xem ghi chú cuối đoạn script) -->
<script>
(function () {
  var HASH = "4627e00ddc49e55b22ba8420be6dd0b94607bec7c4ccdd9d20e37e252fefa776";
  var KEY = "gate-ok-" + HASH.slice(0, 10);
  var unlocked = false;

  try { if (localStorage.getItem(KEY) === "1") return; } catch (e) {}

  var st = document.createElement("style");
  st.textContent =
    "html.locked body>*:not(#gate){display:none!important}" +
    "#gate{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:20px;" +
    "background:#f7f9fd;font-family:Lexend,system-ui,sans-serif;color:#2b2d42}" +
    "#gate form{width:100%;max-width:340px;text-align:center;background:#fff;border:1.5px solid #e3e8f2;" +
    "border-radius:18px;padding:28px 22px;box-shadow:4px 4px 0 #ffd95e}" +
    "#gate h1{margin:0 0 6px;font-size:1.3rem}" +
    "#gate p{margin:0 0 16px;font-size:.85rem;color:#6a6e85}" +
    "#gate input{width:100%;font:inherit;padding:10px 12px;border:1.5px solid #e3e8f2;border-radius:12px;text-align:center}" +
    "#gate input:focus{outline:none;border-color:#2b2d42;box-shadow:2px 2px 0 #6aaaff}" +
    "#gate button{margin-top:12px;width:100%;font:inherit;font-weight:500;padding:10px;border:1.5px solid #2b2d42;" +
    "border-radius:12px;background:#ffd95e;cursor:pointer}" +
    "#gate .err{min-height:1.2em;margin:10px 0 0;font-size:.8rem;color:#d64545}";
  document.head.appendChild(st);
  document.documentElement.classList.add("locked");

  /* SHA-256 thuần JS: dùng khi trình duyệt/preview không có crypto.subtle */
  function sha256js(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    var mp = Math.pow, mw = mp(2, 32), i, j, result = "";
    var words = [], bitLen = ascii.length * 8;
    var hash = [], k = [], pc = 0, comp = {};
    for (var c = 2; pc < 64; c++) {
      if (!comp[c]) {
        for (i = 0; i < 313; i += c) comp[i] = c;
        hash[pc] = (mp(c, 0.5) * mw) | 0;
        k[pc++] = (mp(c, 1 / 3) * mw) | 0;
      }
    }
    ascii += "\x80";
    while (ascii.length % 64 - 56) ascii += "\x00";
    for (i = 0; i < ascii.length; i++) {
      j = ascii.charCodeAt(i);
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words.length] = (bitLen / mw) | 0;
    words[words.length] = bitLen;
    for (j = 0; j < words.length;) {
      var w = words.slice(j, j += 16), old = hash;
      hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + k[i] +
          (w[i] = i < 16 ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] +
            (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(t1 + t2) | 0].concat(hash);
        hash[4] = (hash[4] + t1) | 0;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
    }
    for (i = 0; i < 8; i++) {
      for (j = 3; j + 1; j--) {
        var b = (hash[i] >> (j * 8)) & 255;
        result += (b < 16 ? 0 : "") + b.toString(16);
      }
    }
    return result;
  }

  function sha256(s) {
    if (window.crypto && crypto.subtle && window.TextEncoder) {
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function (b) {
        return Array.prototype.map.call(new Uint8Array(b), function (x) {
          return x.toString(16).padStart(2, "0");
        }).join("");
      }).catch(function () { return sha256js(unescape(encodeURIComponent(s))); });
    }
    return Promise.resolve(sha256js(unescape(encodeURIComponent(s))));
  }

  function build() {
    var g = document.createElement("div");
    g.id = "gate";
    g.innerHTML =
      '<form autocomplete="off">' +
      '<h1>🔒 Nhập mã để vào</h1>' +
      '<p>Trang này cần mã truy cập.</p>' +
      '<input type="password" id="gateInput" inputmode="numeric" placeholder="Mã truy cập" aria-label="Mã truy cập">' +
      '<button type="submit">Vào</button>' +
      '<div class="err" id="gateErr" aria-live="polite"></div>' +
      '</form>';
    document.body.appendChild(g);

    var form = g.querySelector("form");
    var input = g.querySelector("#gateInput");
    var err = g.querySelector("#gateErr");
    input.focus();

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      sha256(input.value.trim()).then(function (h) {
        if (h === HASH) {
          try { localStorage.setItem(KEY, "1"); } catch (e2) {}
          document.documentElement.classList.remove("locked");
          g.remove();
        } else {
          err.textContent = "Sai mã rồi, thử lại nhé 🙈";
          input.value = "";
          input.focus();
        }
      });
    });
  }

  if (document.body) build();
  else document.addEventListener("DOMContentLoaded", build);

  /* Đổi mã: mở Console (F12) dán dòng dưới, thay 565656 bằng mã mới, copy chuỗi ra dán vào HASH:
     crypto.subtle.digest("SHA-256", new TextEncoder().encode("565656")).then(b=>console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")))  */
})();
</script>
