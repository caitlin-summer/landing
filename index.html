<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caitlin</title>
<meta name="theme-color" content="#faf7f0">
<script>try{var th=localStorage.getItem('caitlin_theme');if(th)document.documentElement.dataset.theme=th}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖍️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#faf7f0; --panel:#ffffff; --ink:#2f3347; --muted:#666b7e; --line:#ebe5d6; --hover:#f4efe3;
    --focus:#2b6cdf;
    --red:#f4a0a0; --yellow:#fbd96a; --green:#8ddb98; --blue:#8bbaf7; --purple:#c9aefc;
    --bk-red:#e4575c; --bk-yellow:#e5a000; --bk-green:#2da64e; --bk-blue:#2d7be0; --bk-purple:#8657ee;
    --shadow:0 1px 2px rgba(47,51,71,.06),0 8px 22px -14px rgba(47,51,71,.28);
    --shadow-up:0 2px 4px rgba(47,51,71,.06),0 16px 30px -16px rgba(47,51,71,.38);
    --r-sm:10px; --r-md:18px; --r-pill:999px;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  }
  :root[data-theme="dark"] {
    color-scheme:dark;
    --bg:#181a21; --panel:#22252e; --ink:#e9e7e2; --muted:#a3a7b5; --line:#323645; --hover:#2b2f3b;
    --focus:#8bb4ff;
    --red:#d98585; --yellow:#cfae55; --green:#6fb97b; --blue:#6f9ddb; --purple:#a58ee0;
    --bk-red:#f08a8e; --bk-yellow:#f0c24d; --bk-green:#6fd08a; --bk-blue:#7db4f5; --bk-purple:#b79cf7;
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-up:0 10px 24px -12px rgba(0,0,0,.6);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme:dark;
      --bg:#181a21; --panel:#22252e; --ink:#e9e7e2; --muted:#a3a7b5; --line:#323645; --hover:#2b2f3b;
      --focus:#8bb4ff;
      --red:#d98585; --yellow:#cfae55; --green:#6fb97b; --blue:#6f9ddb; --purple:#a58ee0;
      --bk-red:#f08a8e; --bk-yellow:#f0c24d; --bk-green:#6fd08a; --bk-blue:#7db4f5; --bk-purple:#b79cf7;
      --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-up:0 10px 24px -12px rgba(0,0,0,.6);
    }
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
  body { margin:0; color:var(--ink); background:var(--bg); font-family:"Be Vietnam Pro",system-ui,sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; }
  button { font-family:inherit; color:inherit; }
  [hidden] { display:none !important; }

  .layout { display:grid; grid-template-columns:272px minmax(0,1fr); min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    position:sticky; top:0; height:100vh; overflow-y:auto;
    display:flex; flex-direction:column; gap:var(--s5); padding:var(--s5) var(--s4);
    background:var(--panel); border-right:1px solid var(--line);
  }
  .brand { font-family:"Be Vietnam Pro",system-ui,sans-serif; font-weight:700; font-size:1.65rem; line-height:1; letter-spacing:-.02em; padding:0 var(--s2); }
  .brand span { display:inline-block; }
  .brand .dot { color:var(--bk-yellow); }

  .search { position:relative; }
  .search .glass { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); display:grid; pointer-events:none; }
  .search input {
    width:100%; font:400 16px "Be Vietnam Pro",system-ui,sans-serif; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:var(--r-pill);
    padding:11px 44px 11px 40px; min-height:48px; -webkit-appearance:none; appearance:none;
    transition:border-color .15s, background .15s;
  }
  .search input::placeholder { color:var(--muted); opacity:1; }
  .search input:focus { border-color:var(--focus); outline:none; box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent); }
  .search input::-webkit-search-cancel-button { display:none; }
  .kbd { position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:.78rem; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:0 7px; background:var(--panel); pointer-events:none; }
  .kbd.hide { display:none; }
  .clear { position:absolute; right:7px; top:50%; transform:translateY(-50%); width:34px; height:34px; display:none; place-items:center; background:var(--hover); border:0; border-radius:50%; cursor:pointer; padding:0; }
  .clear.show { display:grid; }

  .nav { display:flex; flex-direction:column; gap:var(--s1); }
  .nav-item {
    display:flex; align-items:center; gap:var(--s3); width:100%; text-align:left;
    background:transparent; border:0; border-radius:14px;
    padding:8px 12px 8px 8px; min-height:50px; font-size:.97rem; cursor:pointer; color:var(--ink);
    transition:background .12s;
  }
  .nav-item:hover { background:var(--hover); }
  .nav-item[aria-current="true"] { background:color-mix(in srgb,var(--g,var(--yellow)) 30%,var(--panel)); font-weight:600; }
  .nav-item .ni { display:grid; place-items:center; width:34px; height:34px; flex:none; border-radius:11px; background:color-mix(in srgb,var(--g,var(--yellow)) 42%,var(--panel)); }
  .nav-item .ni svg { width:18px; height:18px; }
  .nav-item .lbl { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-item .n { font-size:.78rem; min-width:26px; text-align:center; padding:1px 8px; border-radius:var(--r-pill); background:var(--hover); color:var(--muted); }
  .nav-item[aria-current="true"] .n { background:var(--panel); color:var(--ink); }

  .theme { margin-top:auto; display:flex; align-items:center; gap:var(--s3); width:100%; min-height:48px; padding:8px 14px; background:transparent; border:1px solid var(--line); border-radius:var(--r-pill); font-size:.9rem; cursor:pointer; color:var(--muted); }
  .theme:hover { background:var(--hover); color:var(--ink); }
  .theme svg { width:20px; height:20px; flex:none; }
  button:focus-visible,.card:focus-visible,.nav-item:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }

  /* ---------- Main ---------- */
  .main { padding:var(--s6) var(--s6) var(--s6); max-width:1060px; width:100%; margin:0 auto; }
  .page-head { display:flex; align-items:baseline; justify-content:space-between; gap:var(--s4); flex-wrap:wrap; margin:0 0 var(--s5); }
  .page-head h1 { font-weight:700; font-size:1.75rem; line-height:1.2; letter-spacing:-.02em; margin:0; }
  .count { margin:0; color:var(--muted); font-size:.88rem; white-space:nowrap; }

  .section { margin:0 0 var(--s5); }
  .group-title { display:flex; align-items:center; gap:var(--s3); font-family:"Be Vietnam Pro",system-ui,sans-serif; font-weight:700; font-size:1.1rem; line-height:1.2; margin:0 0 var(--s4); }
  .group-title::after { content:""; flex:1; height:1px; background:var(--line); }
  .gicon { display:grid; place-items:center; width:34px; height:34px; background:color-mix(in srgb,var(--g,var(--blue)) 45%,var(--panel)); border-radius:var(--r-sm); }
  .gicon svg { width:18px; height:18px; }
  .sub-section { margin:0 0 var(--s5); }
  .sub-title { font:500 .88rem "Be Vietnam Pro",system-ui,sans-serif; color:var(--muted); margin:0 0 var(--s3); }
  .sub-title .n { margin-left:var(--s1); opacity:.8; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:20px; padding:0 0 6px 0; }
  .card {
    display:flex; flex-direction:column; align-items:stretch;
    background:var(--panel); color:inherit; text-decoration:none;
    border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden;
    box-shadow:var(--shadow);
    transition:transform .18s, box-shadow .18s, border-color .18s;
  }
  .card .row { display:flex; align-items:center; gap:var(--s3); padding:14px 16px 14px 14px; }
  .thumb { aspect-ratio:2/1; overflow:hidden; background:color-mix(in srgb,var(--accent,var(--blue)) 25%,var(--panel)); }
  .thumb img { width:100%; height:100%; object-fit:cover; object-position:center; display:block; transition:transform .35s; }
  .card:hover .thumb img { transform:scale(1.04); }
  .card:hover,.card:focus-visible { transform:translateY(-3px); box-shadow:var(--shadow-up); border-color:color-mix(in srgb,var(--accent,var(--blue)) 70%,var(--line)); }
  .icon { flex:none; width:42px; height:42px; display:grid; place-items:center; color:var(--ink); background:color-mix(in srgb,var(--accent,var(--blue)) 48%,var(--panel)); border-radius:13px; }
  .icon svg { width:21px; height:21px; }
  .text { min-width:0; flex:1; }
  .card h3 { font-family:"Be Vietnam Pro",system-ui,sans-serif; font-size:1.02rem; line-height:1.3; font-weight:600; margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card p { margin:3px 0 0; color:var(--muted); font-size:.88rem; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .tag { display:inline-block; margin-top:5px; font-size:.72rem; color:var(--muted); background:var(--hover); border-radius:var(--r-pill); padding:1px 9px; }
  .go { flex:none; display:grid; place-items:center; width:30px; height:30px; border-radius:50%; background:var(--hover); color:var(--muted); font-size:1rem; transition:background .15s,color .15s,transform .15s; }
  .card:hover .go { background:color-mix(in srgb,var(--accent,var(--blue)) 55%,var(--panel)); color:var(--ink); transform:translate(1px,-1px); }
  .sr-only { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  mark { background:color-mix(in srgb,var(--yellow) 65%,transparent); color:inherit; border-radius:4px; padding:0 2px; }
  .empty { display:none; text-align:center; color:var(--muted); margin-top:40px; }

  /* ---------- Chuyển trang ---------- */
  .pager { display:none; justify-content:center; align-items:center; gap:var(--s2); margin:var(--s4) 0 var(--s1); flex-wrap:wrap; }
  .pager.show { display:flex; }
  .pg { min-width:48px; min-height:48px; padding:0 16px; cursor:pointer; font:500 .95rem "Be Vietnam Pro",system-ui,sans-serif; background:var(--panel); border:1px solid var(--line); border-radius:var(--r-pill); transition:background .12s; }
  .pg:hover:not(:disabled) { background:var(--hover); }
  .pg[aria-current="page"] { background:color-mix(in srgb,var(--yellow) 55%,var(--panel)); border-color:transparent; font-weight:600; }
  .pg:disabled { opacity:.4; cursor:not-allowed; }

  /* Desktop: nếu tổng số hàng <= 3 thì vừa 1 màn hình (JS thêm class "fit") */
  @media (min-width:861px) {
    .main.fit { height:100vh; height:100dvh; overflow-y:auto; display:flex; flex-direction:column; padding-bottom:var(--s4); }
    .main.fit .page-head { margin-bottom:var(--s3); flex:none; }
    .main.fit #grid,.main.fit .section,.main.fit .sub-section { flex:0 1 auto; min-height:0; display:flex; flex-direction:column; }
    .main.fit #grid { flex:1 1 0; }
    .main.fit .section,.main.fit .sub-section { margin:0 0 var(--s2); }
    .main.fit .sub-section .grid,.main.fit .section > .grid { flex:1 1 auto; min-height:0; }
    .main.fit .grid { grid-auto-rows:minmax(0,auto); gap:18px; }
    .main.fit .card { min-height:0; }
    .main.fit .thumb { flex:0 1 auto; min-height:44px; aspect-ratio:2/1; height:auto; }
    .main.fit .card .row { flex:none; }
    .main.fit .pager { flex:none; margin:var(--s2) 0 0; }
  }

  /* ---------- Mobile ---------- */
  @media (max-width:860px) {
    .layout { display:block; }
    .sidebar {
      position:sticky; top:0; z-index:10; height:auto; overflow:visible;
      flex-direction:row; flex-wrap:wrap; align-items:center; gap:10px 10px;
      padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));
      border-right:0; border-bottom:1px solid var(--line);
    }
    .brand { font-size:1.35rem; padding:0; order:0; }
    .search { flex:1 1 150px; order:1; }
    .theme { order:2; width:48px; height:48px; min-height:48px; padding:0; justify-content:center; margin:0; border-radius:50%; }
    .theme .tl { display:none; }
    .nav { order:3; flex:1 0 100%; flex-direction:row; gap:6px; overflow-x:auto; padding:2px 2px 4px; scrollbar-width:none; }
    .nav::-webkit-scrollbar { display:none; }
    .nav-item { width:auto; flex:none; white-space:nowrap; padding:6px 14px 6px 6px; min-height:46px; font-size:.9rem; background:var(--bg); border:1px solid var(--line); border-radius:var(--r-pill); }
    .nav-item .ni { width:30px; height:30px; border-radius:50%; }
    .nav-item .n { display:none; }
    .nav-item[aria-current="true"] { border-color:transparent; }
    .main { padding:var(--s4) max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px)); }
    .page-head h1 { font-size:1.5rem; }
    .grid { grid-template-columns:1fr; gap:16px; }
  }
  @media (prefers-reduced-motion:reduce) {
    html { scroll-behavior:auto; }
    * { animation:none !important; transition:none !important; }
    .card:hover,.card:focus-visible { transform:none; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand" id="brand" aria-label="Caitlin"></div>

    <div class="search" role="search">
      <span class="glass" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
      <input id="q" type="search" placeholder="Tìm app…" aria-label="Tìm app" autocomplete="off">
      <span class="kbd" id="kbd" aria-hidden="true">/</span>
      <button class="clear" id="clear" type="button" aria-label="Xóa tìm kiếm"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    </div>

    <nav class="nav" id="nav" aria-label="Danh mục"></nav>

    <button class="theme" id="theme" type="button" aria-label="Đổi giao diện sáng / tối"><svg id="th-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg><span class="tl" id="th-lbl"></span></button>
  </aside>

  <div class="main">
    <header class="page-head">
      <h1 id="pageTitle"></h1>
      <p class="count" id="count" aria-live="polite"></p>
    </header>
    <main id="grid"></main>
    <nav class="pager" id="pager" aria-label="Chuyển trang"></nav>
    <p class="empty" id="empty" role="status">Chưa có app nào ở mục này 🌱</p>
  </div>
</div>

function icon(name) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.sparkles}</svg>`;
}

const BRAND = "Caitlin";
const COLORS = ["--bk-red", "--bk-yellow", "--bk-green", "--bk-blue", "--bk-purple"];

/* Tên nhiều màu như bút sáp */
const brand = document.getElementById("brand");
brand.textContent = BRAND;
const dot = document.createElement("span");
dot.className = "dot"; dot.textContent = "."; dot.setAttribute("aria-hidden", "true");
brand.appendChild(dot);


const grid = document.getElementById("grid");
const nav = document.getElementById("nav");
const empty = document.getElementById("empty");
const count = document.getElementById("count");
const pageTitle = document.getElementById("pageTitle");
const input = document.getElementById("q");
const clearBtn = document.getElementById("clear");
const kbd = document.getElementById("kbd");
const PAGE_SIZE = 6;   /* mỗi trang tối đa 6 app; mục nào ít hơn thì không hiện nút chuyển trang */
const pager = document.getElementById("pager");
let curGroup = GROUPS[0].name;
let curPage = 1;
let query = "";

function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

/* Bỏ dấu tiếng Việt + chữ thường, để gõ "to mau" vẫn tìm ra "tô màu" */
function fold(s) {
  return String(s || "")
    .toLowerCase()
    .replace(/đ/g, "d")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

/* Tô sáng chữ khớp (so khớp không dấu, nhưng hiển thị chữ gốc) */
function highlight(text, terms) {
  if (!terms.length) return esc(text);
  const src = String(text);
  const chars = [...src];
  const folded = chars.map(c => fold(c) || c).join("");
  if (folded.length !== src.length) return esc(src);
  const mask = new Array(src.length).fill(false);
  terms.forEach(t => {
    let i = folded.indexOf(t);
    while (i !== -1) {
      for (let k = i; k < i + t.length; k++) mask[k] = true;
      i = folded.indexOf(t, i + t.length);
    }
  });
  let out = "", open = false;
  for (let i = 0; i < src.length; i++) {
    if (mask[i] && !open) { out += "<mark>"; open = true; }
    if (!mask[i] && open) { out += "</mark>"; open = false; }
    out += esc(src[i]);
  }
  return open ? out + "</mark>" : out;
}

/* Ảnh bìa: dùng ảnh tự đặt (img) trong thư mục "anh". App nào không có img thì chỉ hiện icon.
   Đặt AUTO_THUMB = true nếu muốn nhờ thum.io tự chụp ảnh cho app chưa có img. */
const AUTO_THUMB = false;
function thumbSrc(a) {
  if (a.img) return a.img;
  if (!AUTO_THUMB || !/^https?:\/\//.test(a.url)) return "";
  return "https://image.thum.io/get/width/800/crop/500/wait/5/" + a.url;
}

function cardHTML(a, terms) {
  const src = thumbSrc(a);
  return `
    <a class="card" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" style="--accent: var(--${esc(a.color || "blue")})">
      ${src ? `<div class="thumb"><img src="${esc(src)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></div>` : ""}
      <div class="row">
        <div class="icon" aria-hidden="true">${icon(a.icon)}</div>
        <div class="text">
          <h3>${highlight(a.title.trim(), terms)}<span class="sr-only"> (mở ở tab mới)</span></h3>
          <p>${highlight(a.desc || "", terms)}</p>
          ${terms.length ? `<span class="tag">${esc(a.type)}</span>` : ""}
        </div>
        <span class="go" aria-hidden="true">↗</span>
      </div>
    </a>`;
}

/* Vừa 1 màn hình: nếu tổng số hàng <= 3 thì bật class "fit"; mỗi mục nhỏ chia chiều cao theo số hàng của nó */
function fitScreen() {
  const main = document.querySelector(".main");
  const grids = [...grid.querySelectorAll(".grid")];
  if (!grids.length || !matchMedia("(min-width: 861px)").matches) { main.classList.remove("fit"); return; }
  const cols = Math.max(1, getComputedStyle(grids[0]).gridTemplateColumns.split(" ").length);
  const total = grids.reduce((a, g) => a + Math.ceil(g.children.length / cols), 0);
  main.classList.toggle("fit", total <= 3);
}
window.addEventListener("resize", () => fitScreen());

function renderNav() {
  const searching = query.trim().length > 0;
  nav.innerHTML = GROUPS.map(g => {
    const n = APPS.filter(a => g.types.includes(a.type)).length;
    const on = !searching && curGroup === g.name ? ' aria-current="true"' : "";
    return `<button type="button" class="nav-item group" data-g="${esc(g.name)}"${on} style="--g: var(--${esc(g.color)})">
      <span class="ni" aria-hidden="true">${icon(g.icon)}</span><span class="lbl">${esc(g.name)}</span><span class="n">${n}</span>
    </button>`;
  }).join("");
}

function render() {
  const terms = fold(query).split(/\s+/).filter(Boolean);
  const searching = terms.length > 0;
  const match = a => {
    const hay = fold([a.title, a.desc, a.type, a.keywords].join(" "));
    return terms.every(t => hay.includes(t));
  };
  let total = 0, pages = 1, curColor = null;

  /* Mặc định chỉ hiện mục đang chọn; khi tìm kiếm thì tìm trên tất cả */
  grid.innerHTML = GROUPS
    .filter(g => searching || g.name === curGroup)
    .map(g => {
      let lists = g.types
        .map(t => ({ t, items: APPS.filter(a => a.type === t && match(a)) }))
        .filter(x => x.items.length);
      if (!lists.length) return "";
      const all = lists.reduce((n, x) => n + x.items.length, 0);
      total += all;
      if (!searching) curColor = g.color;
      const showSub = lists.length > 1;
      if (!searching && all > PAGE_SIZE) {
        pages = Math.ceil(all / PAGE_SIZE);
        if (curPage > pages) curPage = pages;
        let skip = (curPage - 1) * PAGE_SIZE, take = PAGE_SIZE;
        lists = lists.map(x => {
          const items = x.items.slice(skip, skip + take);
          take -= items.length;
          skip = Math.max(skip - x.items.length, 0);
          return { t: x.t, items };
        }).filter(x => x.items.length);
      }
      const blocks = lists.map(({ t, items }) => `
        <div class="sub-section">
          ${showSub ? `<h3 class="sub-title">${esc(t)}<span class="n">${items.length}</span></h3>` : ""}
          <div class="grid">${items.map(a => cardHTML(a, terms)).join("")}</div>
        </div>`).join("");
      return `<section class="section" style="--g: var(--${esc(g.color)})">
        ${searching ? `<h2 class="group-title"><span class="gicon" aria-hidden="true">${icon(g.icon)}</span>${esc(g.name)}</h2>` : ""}
        ${blocks}
      </section>`;
    }).join("");

  document.querySelector(".page-head").style.setProperty("--g", curColor ? `var(--${curColor})` : "var(--yellow)");
  renderPager(pages);
  fitScreen();
  pageTitle.textContent = searching ? `Kết quả cho “${query.trim()}”` : curGroup;
  empty.textContent = searching
    ? `Không tìm thấy “${query.trim()}” 🔎 Thử từ khác nhé!`
    : "Chưa có app nào ở mục này 🌱";
  empty.style.display = total ? "none" : "block";
  count.textContent = total ? `${total} app${pages > 1 ? ` · trang ${curPage}/${pages}` : ""}` : "";
  clearBtn.classList.toggle("show", query.length > 0);
  kbd.classList.toggle("hide", query.length > 0);
  renderNav();
}

function renderPager(pages) {
  pager.classList.toggle("show", pages > 1);
  if (pages <= 1) { pager.innerHTML = ""; return; }
  let h = `<button type="button" class="pg" data-p="${curPage - 1}" aria-label="Trang trước"${curPage === 1 ? " disabled" : ""}>‹</button>`;
  for (let i = 1; i <= pages; i++) {
    h += `<button type="button" class="pg" data-p="${i}" aria-label="Trang ${i}"${i === curPage ? ' aria-current="page"' : ""}>${i}</button>`;
  }
  h += `<button type="button" class="pg" data-p="${curPage + 1}" aria-label="Trang sau"${curPage === pages ? " disabled" : ""}>›</button>`;
  pager.innerHTML = h;
}
function goPage(p) {
  curPage = p; render();
  window.scrollTo({ top: 0 });
  const m = document.querySelector(".main"); if (m) m.scrollTop = 0;
}
pager.addEventListener("click", e => {
  const b = e.target.closest(".pg");
  if (b && !b.disabled) goPage(+b.dataset.p);
});
/* Phím ← → để chuyển trang */
document.addEventListener("keydown", e => {
  if (!pager.classList.contains("show") || document.activeElement === input || e.ctrlKey || e.metaKey || e.altKey) return;
  const n = pager.querySelectorAll("[data-p]").length - 2;
  if (e.key === "ArrowLeft" && curPage > 1) goPage(curPage - 1);
  if (e.key === "ArrowRight" && curPage < n) goPage(curPage + 1);
});

nav.addEventListener("click", e => {
  const b = e.target.closest(".nav-item");
  if (!b) return;
  curGroup = b.dataset.g; curPage = 1;
  input.value = ""; query = "";
  render();
  window.scrollTo({ top: 0 });
});

input.addEventListener("input", () => { query = input.value; curPage = 1; render(); });
clearBtn.addEventListener("click", () => { input.value = ""; query = ""; render(); input.focus(); });
input.addEventListener("keydown", e => {
  if (e.key === "Escape" && query) { input.value = ""; query = ""; render(); }
});
/* Nhấn "/" để nhảy vào ô tìm kiếm */
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== input && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    input.focus();
  }
});

/* Chế độ sáng / tối: nhớ lựa chọn trên máy này */
const rootEl = document.documentElement, themeBtn = document.getElementById("theme");
const MOON = '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>';
const SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>';
function isDark() { const t = rootEl.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function paintTheme() {
  const d = isDark();
  document.getElementById("th-ic").innerHTML = d ? SUN : MOON;
  document.getElementById("th-lbl").textContent = d ? "Chế độ sáng" : "Chế độ tối";
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = d ? "#181a21" : "#faf7f0";
}
themeBtn.addEventListener("click", () => {
  const n = isDark() ? "light" : "dark";
  rootEl.dataset.theme = n;
  try { localStorage.setItem("caitlin_theme", n); } catch (e) {}
  paintTheme();
});
paintTheme();

render();
</script>
