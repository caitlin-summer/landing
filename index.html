<!-- CỔNG MẬT KHẨU: đổi mã bằng cách thay HASH (xem ghi chú cuối đoạn script) -->
<script>
(function () {
  var HASH = "4627e00ddc49e55b22ba8420be6dd0b94607bec7c4ccdd9d20e37e252fefa776";
  var KEY = "gate-ok-" + HASH.slice(0, 10);
  var unlocked = false;

  try { if (localStorage.getItem(KEY) === "1") return; } catch (e) {}

  var st = document.createElement("style");
  st.textContent =
    "html.locked body>*:not(#gate){display:none!important}" +
    "#gate{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:20px;" +
    "background:#f7f9fd;font-family:Lexend,system-ui,sans-serif;color:#2b2d42}" +
    "#gate form{width:100%;max-width:340px;text-align:center;background:#fff;border:1.5px solid #e3e8f2;" +
    "border-radius:18px;padding:28px 22px;box-shadow:4px 4px 0 #ffd95e}" +
    "#gate h1{margin:0 0 6px;font-size:1.3rem}" +
    "#gate p{margin:0 0 16px;font-size:.85rem;color:#6a6e85}" +
    "#gate input{width:100%;font:inherit;padding:10px 12px;border:1.5px solid #e3e8f2;border-radius:12px;text-align:center}" +
    "#gate input:focus-visible,#gate button:focus-visible{outline:3px solid #2b6cdf;outline-offset:2px}" +
    "#gate button{margin-top:12px;width:100%;font:inherit;font-weight:500;padding:10px;border:1.5px solid #2b2d42;" +
    "border-radius:12px;background:#ffd95e;cursor:pointer}" +
    "#gate .err{min-height:1.2em;margin:10px 0 0;font-size:.85rem;color:#b3261e}" +
    "#gate input,#gate button{min-height:44px}";
  document.head.appendChild(st);
  document.documentElement.classList.add("locked");

  /* SHA-256 thuần JS: dùng khi trình duyệt/preview không có crypto.subtle */
  function sha256js(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    var mp = Math.pow, mw = mp(2, 32), i, j, result = "";
    var words = [], bitLen = ascii.length * 8;
    var hash = [], k = [], pc = 0, comp = {};
    for (var c = 2; pc < 64; c++) {
      if (!comp[c]) {
        for (i = 0; i < 313; i += c) comp[i] = c;
        hash[pc] = (mp(c, 0.5) * mw) | 0;
        k[pc++] = (mp(c, 1 / 3) * mw) | 0;
      }
    }
    ascii += "\x80";
    while (ascii.length % 64 - 56) ascii += "\x00";
    for (i = 0; i < ascii.length; i++) {
      j = ascii.charCodeAt(i);
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words.length] = (bitLen / mw) | 0;
    words[words.length] = bitLen;
    for (j = 0; j < words.length;) {
      var w = words.slice(j, j += 16), old = hash;
      hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + k[i] +
          (w[i] = i < 16 ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] +
            (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(t1 + t2) | 0].concat(hash);
        hash[4] = (hash[4] + t1) | 0;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
    }
    for (i = 0; i < 8; i++) {
      for (j = 3; j + 1; j--) {
        var b = (hash[i] >> (j * 8)) & 255;
        result += (b < 16 ? 0 : "") + b.toString(16);
      }
    }
    return result;
  }

  function sha256(s) {
    if (window.crypto && crypto.subtle && window.TextEncoder) {
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function (b) {
        return Array.prototype.map.call(new Uint8Array(b), function (x) {
          return x.toString(16).padStart(2, "0");
        }).join("");
      }).catch(function () { return sha256js(unescape(encodeURIComponent(s))); });
    }
    return Promise.resolve(sha256js(unescape(encodeURIComponent(s))));
  }

  function build() {
    var g = document.createElement("div");
    g.id = "gate";
    g.innerHTML =
      '<form autocomplete="off">' +
      '<h1>Nhập mã để vào</h1>' +
      '<p>Trang này cần mã truy cập.</p>' +
      '<input type="password" id="gateInput" inputmode="numeric" placeholder="Mã truy cập" aria-label="Mã truy cập">' +
      '<button type="submit">Vào</button>' +
      '<div class="err" id="gateErr" aria-live="polite"></div>' +
      '</form>';
    document.body.appendChild(g);

    var form = g.querySelector("form");
    var input = g.querySelector("#gateInput");
    var err = g.querySelector("#gateErr");
    input.focus();

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      sha256(input.value.trim()).then(function (h) {
        if (h === HASH) {
          var saved = false;
          try { localStorage.setItem(KEY, "1"); saved = localStorage.getItem(KEY) === "1"; } catch (e2) {}
          if (saved) { location.reload(); return; }
          document.documentElement.classList.remove("locked");
          g.remove();
          window.dispatchEvent(new Event("resize"));
        } else {
          err.textContent = "Sai mã rồi, thử lại nhé 🙈";
          input.value = "";
          input.focus();
        }
      });
    });
  }

  if (document.body) build();
  else document.addEventListener("DOMContentLoaded", build);

  /* Đổi mã: mở Console (F12) dán dòng dưới, thay 565656 bằng mã mới, copy chuỗi ra dán vào HASH:
     crypto.subtle.digest("SHA-256", new TextEncoder().encode("565656")).then(b=>console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")))  */
})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖍️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f9fd;
    --panel: #ffffff;
    --ink: #2b2d42;
    --muted: #5a5e75;
    --focus: #2b6cdf;
    --line: #e3e8f2;
    --hover: #f0f4fb;
    --red: #ff8a8a;
    --yellow: #ffd95e;
    --green: #7fd68b;
    --blue: #6aaaff;
    --purple: #c4a1ff;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Lexend", system-ui, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; color: inherit; }

  .layout { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 18px;
    padding: 24px 16px;
    background: var(--panel);
    border-right: 1.5px solid var(--line);
  }
  .brand {
    font-family: "Baloo 2", "Lexend", sans-serif; font-weight: 800;
    font-size: 1.75rem; line-height: 1; letter-spacing: .5px;
    padding: 0 8px;
  }
  .brand span { display: inline-block; }
  .brand .wiggle { animation: wiggle 1.2s ease-in-out 1; }
  @keyframes wiggle {
    0%,100% { transform: rotate(0); }
    25% { transform: rotate(-8deg) translateY(-5px); }
    60% { transform: rotate(6deg) translateY(-2px); }
  }

  .search { position: relative; }
  .search .glass {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted); display: grid; pointer-events: none;
  }
  .search input {
    width: 100%;
    font: 400 .88rem "Lexend", sans-serif;
    color: var(--ink);
    background: var(--bg);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 11px 40px 11px 36px; min-height: 44px;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .search input::placeholder { color: var(--muted); opacity: 1; }
  .search input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; background: #fff; border-color: var(--ink); }
  .search input::-webkit-search-cancel-button { display: none; }
  .kbd {
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    font-size: .78rem; color: var(--muted);
    border: 1.5px solid var(--line); border-radius: 6px; padding: 0 6px; background: #fff;
    pointer-events: none;
  }
  .kbd.hide { display: none; }
  .clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; display: none; place-items: center;
    font-size: .8rem; background: var(--hover);
    border: 0; border-radius: 50%; cursor: pointer; padding: 0; line-height: 1;
  }
  .clear.show { display: grid; }
  .clear:hover { background: var(--yellow); }

  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav-group { display: flex; flex-direction: column; gap: 2px; margin-top: 12px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left;
    background: transparent; border: 0; border-radius: 10px;
    padding: 10px 10px; min-height: 44px;
    font-size: .9rem; cursor: pointer;
    transition: background .12s;
  }
  .nav-item:hover { background: var(--hover); }
  .nav-item[aria-current="true"] { background: #fff1bf; font-weight: 500; }
  .nav-item .ni { display: grid; place-items: center; width: 22px; height: 22px; flex: none; }
  .nav-item .ni svg { width: 18px; height: 18px; }
  .nav-item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item .n { font-size: .78rem; color: var(--muted); }
  .nav-item.group { font-weight: 500; }
  .nav-item.sub { padding-left: 14px; font-size: .84rem; color: #444a63; }
  .nav-item.sub .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--blue)); border: 1.5px solid var(--ink); margin: 0 7px 0 3px; flex: none; }
  .nav-item:focus-visible, .card:focus-visible, .clear:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .card:focus-visible { border-color: var(--ink); transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--accent, var(--blue)); }

  /* ---------- Main ---------- */
  .main { padding: 40px 40px 64px; max-width: 1000px; width: 100%; margin: 0 auto; }
  .page-head { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; margin: 0 0 28px; }
  .page-head h1 { font-family: "Baloo 2", "Lexend", sans-serif; font-weight: 800; font-size: 1.7rem; line-height: 1.2; margin: 0; }
  .count { margin: 0; color: var(--muted); font-size: .82rem; white-space: nowrap; }

  .section { margin: 0 0 32px; }
  .group-title {
    display: flex; align-items: center; gap: 10px;
    font-family: "Baloo 2", "Lexend", sans-serif; font-weight: 800;
    font-size: 1.15rem; line-height: 1.2; margin: 0 0 14px;
  }
  .group-title::after { content: ""; flex: 1; height: 0; border-top: 2px dotted rgba(43, 45, 66, .22); }
  .gicon { display: grid; place-items: center; width: 30px; height: 30px; background: var(--g, var(--blue)); background: color-mix(in srgb, var(--g, var(--blue)) 55%, white); border-radius: 9px; }
  .gicon svg { width: 17px; height: 17px; }
  .sub-section { margin: 0 0 20px; }
  .sub-title { font: 500 .8rem "Lexend", sans-serif; color: var(--muted); margin: 0 0 10px; }
  .sub-title .n { margin-left: 4px; opacity: .8; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .card {
    display: flex; flex-direction: column; align-items: stretch;
    background: var(--panel);
    color: inherit; text-decoration: none;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(43, 45, 66, .04);
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .card .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 12px; }
  .thumb {
    aspect-ratio: 2 / 1; overflow: hidden;
    background: #eef2f9; background: color-mix(in srgb, var(--accent, var(--blue)) 18%, white);
    border-bottom: 1.5px solid var(--line);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; transition: transform .25s; }
  .card:hover .thumb img { transform: scale(1.04); }
  .card:hover { border-color: var(--ink); transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--accent, var(--blue)); }
  .icon {
    flex: none; width: 42px; height: 42px; display: grid; place-items: center;
    color: var(--ink);
    background: var(--accent, var(--blue));
    background: color-mix(in srgb, var(--accent, var(--blue)) 50%, white);
    border-radius: 12px;
  }
  .icon svg { width: 22px; height: 22px; }
  .text { min-width: 0; flex: 1; }
  .card h3 {
    font-family: "Baloo 2", "Lexend", sans-serif; font-size: 1rem; line-height: 1.2; font-weight: 800;
    margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card p { margin: 1px 0 0; color: var(--muted); font-size: .82rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .go { flex: none; font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 1rem; opacity: .3; transition: opacity .15s, transform .15s; }
  .card:hover .go { opacity: .9; transform: translate(1px, -1px); }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  mark { background: var(--yellow); color: inherit; border-radius: 4px; padding: 0 2px; }
  .empty { display: none; text-align: center; color: var(--muted); margin-top: 40px; }

  /* ---------- Mobile: sidebar thành thanh trên cùng ---------- */
  @media (max-width: 860px) {
    .layout { display: block; }
    .sidebar {
      position: sticky; top: 0; z-index: 10; height: auto; overflow: visible;
      flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px 12px;
      padding: 10px 14px;
      border-right: 0; border-bottom: 1.5px solid var(--line);
    }
    .brand { font-size: 1.4rem; padding: 0; }
    .search { flex: 1 1 160px; }
    .nav { flex: 1 0 100%; flex-direction: row; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .nav::-webkit-scrollbar { display: none; }
    .nav-group { display: contents; }
    .nav-item, .nav-item.sub, .nav-item.group {
      width: auto; flex: none; white-space: nowrap; margin: 0;
      padding: 10px 14px; min-height: 44px; font-size: .85rem; font-weight: 400;
      background: var(--panel); border: 1.5px solid var(--line); border-radius: 999px;
    }
    .nav-item[aria-current="true"] { background: #fff1bf; border-color: var(--ink); }
    .nav-item .ni, .nav-item .dot { display: none; }
    .nav-item .n { margin-left: 2px; }
    .main { padding: 20px 16px 48px; }
    .page-head h1 { font-size: 1.4rem; }
    .grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { animation: none !important; transition: none !important; }
    .card:hover, .card:focus-visible { transform: none; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand" id="brand" aria-label="Caitlin"></div>

    <div class="search" role="search">
      <span class="glass" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
      <input id="q" type="search" placeholder="Tìm app…" aria-label="Tìm app" autocomplete="off">
      <span class="kbd" id="kbd" aria-hidden="true">/</span>
      <button class="clear" id="clear" type="button" aria-label="Xóa tìm kiếm"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    </div>

    <nav class="nav" id="nav" aria-label="Danh mục"></nav>
  </aside>

  <div class="main">
    <header class="page-head">
      <h1 id="pageTitle"></h1>
      <p class="count" id="count" aria-live="polite"></p>
    </header>
    <main id="grid"></main>
    <p class="empty" id="empty" role="status">Chưa có app nào ở mục này 🌱</p>
  </div>
</div>

<script>
/* Ảnh bìa nhúng thẳng vào file (base64) — không cần thư mục "anh". Thêm ảnh mới: đổi ảnh sang base64 rồi thêm vào đây,

function icon(name) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.sparkles}</svg>`;
}

const BRAND = "Caitlin";
const COLORS = ["--red", "--yellow", "--green", "--blue", "--purple"];

/* Tên nhiều màu như bút sáp */
const brand = document.getElementById("brand");
[...BRAND].forEach((ch, i) => {
  const s = document.createElement("span");
  s.textContent = ch;
  s.style.color = `var(${COLORS[i % COLORS.length]})`;
  s.style.textShadow = "1.5px 1.5px 0 var(--ink)";
  s.style.animationDelay = `${i * 60}ms`;
  s.className = "wiggle";
  s.setAttribute("aria-hidden", "true");
  brand.appendChild(s);
});

const grid = document.getElementById("grid");
const nav = document.getElementById("nav");
const empty = document.getElementById("empty");
const count = document.getElementById("count");
const pageTitle = document.getElementById("pageTitle");
const input = document.getElementById("q");
const clearBtn = document.getElementById("clear");
const kbd = document.getElementById("kbd");
let curGroup = GROUPS[0].name;
let query = "";

function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

/* Bỏ dấu tiếng Việt + chữ thường, để gõ "to mau" vẫn tìm ra "tô màu" */
function fold(s) {
  return String(s || "")
    .toLowerCase()
    .replace(/đ/g, "d")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

/* Tô sáng chữ khớp (so khớp không dấu, nhưng hiển thị chữ gốc) */
function highlight(text, terms) {
  if (!terms.length) return esc(text);
  const src = String(text);
  const chars = [...src];
  const folded = chars.map(c => fold(c) || c).join("");
  if (folded.length !== src.length) return esc(src);
  const mask = new Array(src.length).fill(false);
  terms.forEach(t => {
    let i = folded.indexOf(t);
    while (i !== -1) {
      for (let k = i; k < i + t.length; k++) mask[k] = true;
      i = folded.indexOf(t, i + t.length);
    }
  });
  let out = "", open = false;
  for (let i = 0; i < src.length; i++) {
    if (mask[i] && !open) { out += "<mark>"; open = true; }
    if (!mask[i] && open) { out += "</mark>"; open = false; }
    out += esc(src[i]);
  }
  return open ? out + "</mark>" : out;
}

/* Ảnh bìa: dùng ảnh tự đặt (img) trong thư mục "anh". App nào không có img thì chỉ hiện icon.
   Đặt AUTO_THUMB = true nếu muốn nhờ thum.io tự chụp ảnh cho app chưa có img. */
const AUTO_THUMB = false;
function thumbSrc(a) {
  if (a.img) return a.img;
  if (!AUTO_THUMB || !/^https?:\/\//.test(a.url)) return "";
  return "https://image.thum.io/get/width/800/crop/500/wait/5/" + a.url;
}

function cardHTML(a, terms) {
  return `
    <a class="card" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" title="${esc(a.desc || "")}" style="--accent: var(--${esc(a.color || "blue")})">
      ${thumbSrc(a) ? `<div class="thumb"><img src="${esc(thumbSrc(a))}" alt="" loading="lazy" onerror="this.parentNode.remove()"></div>` : ""}
      <div class="row">
        <div class="icon" aria-hidden="true">${icon(a.icon)}</div>
        <div class="text">
          <h3>${highlight(a.title, terms)}<span class="sr-only"> (mở ở tab mới)</span></h3>
          <p>${highlight(a.desc || "", terms)}</p>
        </div>
        <span class="go" aria-hidden="true">↗</span>
      </div>
    </a>`;
}

function renderNav() {
  const searching = query.trim().length > 0;
  nav.innerHTML = GROUPS.map(g => {
    const n = APPS.filter(a => g.types.includes(a.type)).length;
    const on = !searching && curGroup === g.name ? ' aria-current="true"' : "";
    return `<button type="button" class="nav-item group" data-g="${esc(g.name)}"${on}>
      <span class="ni" aria-hidden="true">${icon(g.icon)}</span><span class="lbl">${esc(g.name)}</span><span class="n">${n}</span>
    </button>`;
  }).join("");
}

function render() {
  const terms = fold(query).split(/\s+/).filter(Boolean);
  const searching = terms.length > 0;
  const match = a => {
    const hay = fold([a.title, a.desc, a.type, a.keywords].join(" "));
    return terms.every(t => hay.includes(t));
  };
  let total = 0;

  /* Mặc định chỉ hiện mục đang chọn; khi tìm kiếm thì tìm trên tất cả */
  grid.innerHTML = GROUPS
    .filter(g => searching || g.name === curGroup)
    .map(g => {
      const lists = g.types
        .map(t => ({ t, items: APPS.filter(a => a.type === t && match(a)) }))
        .filter(x => x.items.length);
      if (!lists.length) return "";
      const showSub = lists.length > 1;
      const blocks = lists.map(({ t, items }) => {
        total += items.length;
        return `
        <div class="sub-section">
          ${showSub ? `<h3 class="sub-title">${esc(t)}<span class="n">${items.length}</span></h3>` : ""}
          <div class="grid">${items.map(a => cardHTML(a, terms)).join("")}</div>
        </div>`;
      }).join("");
      return `<section class="section" style="--g: var(--${esc(g.color)})">
        ${searching ? `<h2 class="group-title"><span class="gicon" aria-hidden="true">${icon(g.icon)}</span>${esc(g.name)}</h2>` : ""}
        ${blocks}
      </section>`;
    }).join("");

  pageTitle.textContent = searching ? `Kết quả cho “${query.trim()}”` : curGroup;
  empty.textContent = searching
    ? `Không tìm thấy “${query.trim()}” 🔎 Thử từ khác nhé!`
    : "Chưa có app nào ở mục này 🌱";
  empty.style.display = total ? "none" : "block";
  count.textContent = total ? `${total} app` : "";
  clearBtn.classList.toggle("show", query.length > 0);
  kbd.classList.toggle("hide", query.length > 0);
  renderNav();
}

nav.addEventListener("click", e => {
  const b = e.target.closest(".nav-item");
  if (!b) return;
  curGroup = b.dataset.g;
  input.value = ""; query = "";
  render();
  window.scrollTo({ top: 0 });
});

input.addEventListener("input", () => { query = input.value; render(); });
clearBtn.addEventListener("click", () => { input.value = ""; query = ""; render(); input.focus(); });
input.addEventListener("keydown", e => {
  if (e.key === "Escape" && query) { input.value = ""; query = ""; render(); }
});
/* Nhấn "/" để nhảy vào ô tìm kiếm */
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== input && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    input.focus();
  }
});

render();
</script>
